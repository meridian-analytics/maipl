server {
        listen       3100;
        server_name  test-file.maipl-dev.com;

        location / {
            root   /usr/share/nginx/html/file-service;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        location ~ \.js$ {
            root /usr/share/nginx/html/file-service;
            add_header Content-Type application/javascript;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html/file-service;
        }
    }

