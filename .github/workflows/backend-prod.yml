name: Backend and Worker Build and Deploy to Production instance

on:
  push:
    branches:
      - main
      - backend-main
    paths:
      - backend/**
      - .github/workflows/backend-prod.yml

jobs:
  build:
    runs-on: self-hosted
    env:
      # Infrastructure variables
      REGISTRY_URL: ${{ vars.REGISTRY_URL }}
      BACKEND_HOST_A: ${{ vars.PROD_BACKEND_HOST_A }}
      BACKEND_HOST_B: ${{ vars.PROD_BACKEND_HOST_B }}
      WORKER_HOST_A: ${{ vars.PROD_WORKER_HOST_A }}
      WORKER_HOST_B: ${{ vars.PROD_WORKER_HOST_B }}
      WORKER_HOST_C: ${{ vars.PROD_WORKER_HOST_C }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}

      # Email variables
      EMAIL_HOST: ${{ vars.EMAIL_HOST }}
      EMAIL_PORT: ${{ vars.EMAIL_PORT }}
      EMAIL_HOST_USER: ${{ vars.EMAIL_HOST_USER }}
      DEFAULT_FROM_EMAIL: ${{ vars.DEFAULT_FROM_EMAIL }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}

      # Redis variables
      REDIS_HOST: ${{ vars.REDIS_HOST }}

      # Celery broker variables
      CELERY_BROKER_URL_USER: ${{ secrets.CELERY_BROKER_URL_USER }}
      CELERY_BROKER_URL_PASSWORD: ${{ secrets.CELERY_BROKER_URL_PASSWORD }}
      CELERY_BROKER_URL_HOST: ${{ vars.CELERY_BROKER_URL_HOST }}

      # minio variables
      MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
      MINIO_EXTERNAL_ENDPOINT: ${{ vars.MINIO_EXTERNAL_ENDPOINT }}

      # postgres variables
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: 5432
      
      FILE_CACHE_LOCATION: /mnt/file_cache
      TASKS_LOCAL_STORAGE: /mnt/tasks

      # Environment-specific variables (PRODUCTION)
      ENVIRONMENT: "production"
      DJANGO_PORT: 8000
      DEBUG: 0
      DJANGO_ALLOWED_HOSTS: ${{ vars.PROD_DJANGO_ALLOWED_HOSTS }}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${{ vars.PROD_DJANGO_CSRF_TRUSTED_ORIGINS }}
      CORS_ALLOWED_ORIGINS: ${{ vars.PROD_CORS_ALLOWED_ORIGINS }}
      POSTGRES_DB: ${{ vars.PROD_POSTGRES_DB }}
      MINIO_BUCKET_NAME: ${{ vars.PROD_MINIO_BUCKET_NAME }}
      ALLOWED_REDIRECT_URLS: ${{ vars.PROD_ALLOWED_REDIRECT_URLS }}
      REDIS_DB: ${{ vars.PROD_REDIS_DB }}

      # Environment-specific secrets
      POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
      MINIO_ACCESS_KEY: ${{ secrets.PROD_MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.PROD_MINIO_SECRET_KEY }}
      DJANGO_SECRET_KEY: ${{ secrets.PROD_DJANGO_SECRET_KEY }}
      
    steps:
      - uses: actions/checkout@v4

      - name: login to registry
        run: |
          echo $REGISTRY_PASSWORD | docker login $REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin 

      - name: Build backend and worker
        working-directory: backend/compose
        run: docker compose -f docker-compose.build.yml build

      - name: Tag backend and worker
        run: |
          docker tag $REGISTRY_URL/maipl-backend/ketos-backend:dev $REGISTRY_URL/maipl-backend/ketos-backend:prod
          docker tag $REGISTRY_URL/maipl-backend/ketos-worker:dev $REGISTRY_URL/maipl-backend/ketos-worker:prod

      - name: Push backend and worker to registry
        run: |
          docker push $REGISTRY_URL/maipl-backend/ketos-backend:prod
          docker push $REGISTRY_URL/maipl-backend/ketos-worker:prod

      - name: Generate environment file
        run: |
          # Create .env file by combining variables and secrets
          cat > backend/.env << EOL
          # Environment
          DJANGO_ENV=${ENVIRONMENT}
          
          # Django settings
          DJANGO_PORT=${DJANGO_PORT:-8000}
          DEBUG=${DEBUG:-0}
          DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost}
          DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost}
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          
          # Cors settings
          CORS_ALLOW_ALL_ORIGINS=false
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          
          # Database connection
          POSTGRES_DB=${POSTGRES_DB:-maipl-backend-prod}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_HOST=${POSTGRES_HOST:-maipl-database-prod-1}
          POSTGRES_PORT=${POSTGRES_PORT:-5432}
          
          # Minio settings
          MINIO_ENDPOINT=${MINIO_ENDPOINT:-maipl-minio-prod-1:9000}
          MINIO_USE_HTTPS=False
          MINIO_EXTERNAL_ENDPOINT=${MINIO_EXTERNAL_ENDPOINT:-minio.maipl.com}
          MINIO_EXTERNAL_ENDPOINT_USE_HTTPS=True
          MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
          MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
          MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-maipl-prod}
          
          # Email settings
          EMAIL_HOST=${EMAIL_HOST}
          EMAIL_PORT=${EMAIL_PORT}
          EMAIL_HOST_USER=${EMAIL_HOST_USER}
          EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
          DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
          EMAIL_USE_TLS=False
          EMAIL_USE_SSL=True
          
          # Other configuration
          ALLOWED_REDIRECT_URLS=${ALLOWED_REDIRECT_URLS}
          
          # File cache
          FILE_CACHE_LOCATION=${FILE_CACHE_LOCATION:-/mnt/file_cache}
          TASKS_LOCAL_STORAGE=${TASKS_LOCAL_STORAGE:-/mnt/tasks}
          
          # Redis
          REDIS_HOST=${REDIS_HOST:-maipl-redis} 
          REDIS_DB=${REDIS_DB:-2}

          # Celery broker
          CELERY_BROKER_URL_USER=${CELERY_BROKER_URL_USER}
          CELERY_BROKER_URL_PASSWORD=${CELERY_BROKER_URL_PASSWORD}
          CELERY_BROKER_URL_HOST=${CELERY_BROKER_URL_HOST}
          EOL

      - name: Deploy backends
        run: |
          # Create directory if it doesn't exist
          ssh ubuntu@$BACKEND_HOST_A "mkdir -p ~/backend"
          ssh ubuntu@$BACKEND_HOST_B "mkdir -p ~/backend"

          # Copy compose files and environment file
          scp backend/compose/docker-compose.backend.yml ubuntu@$BACKEND_HOST_A:~/backend/docker-compose.yml
          scp backend/compose/docker-compose.backend.yml ubuntu@$BACKEND_HOST_B:~/backend/docker-compose.yml
          scp backend/.env ubuntu@$BACKEND_HOST_A:~/backend/.env
          scp backend/.env ubuntu@$BACKEND_HOST_B:~/backend/.env
          scp backend/compose/promtail-config.yml ubuntu@$BACKEND_HOST_A:~/backend/promtail-config.yml
          scp backend/compose/promtail-config.yml ubuntu@$BACKEND_HOST_B:~/backend/promtail-config.yml

          # Deploy
          ssh ubuntu@$BACKEND_HOST_A "cd ~/backend && \
            echo $REGISTRY_PASSWORD | docker login $REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin && \
            docker compose pull && \
            docker compose down --remove-orphans && \
            docker compose up -d && \
            docker system prune -f"

          ssh ubuntu@$BACKEND_HOST_B "cd ~/backend && \
            echo $REGISTRY_PASSWORD | docker login $REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin && \
            docker compose pull && \
            docker compose down --remove-orphans && \
            docker compose up -d && \
            docker system prune -f"

      - name: Deploy workers
        run: |
          # Create directory if it doesn't exist
          ssh ubuntu@$WORKER_HOST_A "mkdir -p ~/worker"
          ssh ubuntu@$WORKER_HOST_B "mkdir -p ~/worker"
          ssh ubuntu@$WORKER_HOST_C "mkdir -p ~/worker"
          
          # Copy compose files and environment file
          scp backend/compose/docker-compose.worker.yml ubuntu@$WORKER_HOST_A:~/worker/docker-compose.yml
          scp backend/compose/docker-compose.worker.yml ubuntu@$WORKER_HOST_B:~/worker/docker-compose.yml
          scp backend/compose/docker-compose.worker.yml ubuntu@$WORKER_HOST_C:~/worker/docker-compose.yml
          scp backend/.env ubuntu@$WORKER_HOST_A:~/worker/.env
          scp backend/.env ubuntu@$WORKER_HOST_B:~/worker/.env
          scp backend/.env ubuntu@$WORKER_HOST_C:~/worker/.env
          scp backend/compose/promtail-config.yml ubuntu@$WORKER_HOST_A:~/worker/promtail-config.yml
          scp backend/compose/promtail-config.yml ubuntu@$WORKER_HOST_B:~/worker/promtail-config.yml
          scp backend/compose/promtail-config.yml ubuntu@$WORKER_HOST_C:~/worker/promtail-config.yml

          # Deploy
          ssh ubuntu@$WORKER_HOST_A "cd ~/worker && \
            echo $REGISTRY_PASSWORD | docker login $REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin && \
            docker compose pull && \
            docker compose down --remove-orphans && \
            docker compose up -d && \
            docker system prune -f"

          ssh ubuntu@$WORKER_HOST_B "cd ~/worker && \
            echo $REGISTRY_PASSWORD | docker login $REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin && \
            docker compose pull && \
            docker compose down --remove-orphans && \
            docker compose up -d && \
            docker system prune -f"

          ssh ubuntu@$WORKER_HOST_C "cd ~/worker && \
            echo $REGISTRY_PASSWORD | docker login $REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin && \
            docker compose pull && \
            docker compose down --remove-orphans && \
            docker compose up -d && \
            docker system prune -f"
