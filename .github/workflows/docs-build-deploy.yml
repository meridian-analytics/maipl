name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-build-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish and deploy the production docs site"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - working-directory: docs
        run: npm ci
      - working-directory: docs
        run: npm run build
      - name: Upload documentation build
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build
          retention-days: 1

  deploy:
    name: Deploy documentation
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: validate
    runs-on: [self-hosted, maipl-production]
    timeout-minutes: 20
    environment: production
    env:
      REGISTRY_URL: ${{ vars.REGISTRY_URL }}
      IMAGE: ${{ vars.REGISTRY_URL }}/library/docs-site:latest
      DOCS_HOST: ${{ vars.PROD_DOCS_HOST }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Download documentation build
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs/build
      - name: Login to Whidden Harbor
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | \
            docker login "http://$REGISTRY_URL" \
              --username "$REGISTRY_USERNAME" \
              --password-stdin
      - name: Build and push image
        working-directory: docs
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
      - name: Setup SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DOCS_HOST" >> ~/.ssh/known_hosts
      - name: Deploy docs site
        run: |
          ssh "ubuntu@$DOCS_HOST" "
            set -e
            docker pull '$IMAGE'
            docker rm --force docs-site 2>/dev/null || true
            docker run --detach \
              --name docs-site \
              --publish 3000:80 \
              --restart unless-stopped \
              '$IMAGE'
            sleep 5
            test \"\$(docker inspect --format '{{.State.Running}}' docs-site)\" = true
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          "
