name: Build and Deploy Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-build-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build, publish, and deploy the production docs site"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      REGISTRY_URL: ${{ vars.REGISTRY_URL }}
      IMAGE: ${{ vars.REGISTRY_URL }}/library/docs-site:latest
      DOCS_HOST: ${{ vars.PROD_DOCS_HOST }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build documentation
        working-directory: docs
        run: npm run build

      - name: Login to Whidden Harbor
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | \
            docker login "http://$REGISTRY_URL" \
              --username "$REGISTRY_USERNAME" \
              --password-stdin

      - name: Build and push image
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        working-directory: docs
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Setup SSH
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DOCS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy docs site
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: |
          ssh "ubuntu@$DOCS_HOST" "
            set -e
            docker pull '$IMAGE'
            docker rm --force docs-site 2>/dev/null || true
            docker run --detach \
              --name docs-site \
              --publish 3000:80 \
              --restart unless-stopped \
              '$IMAGE'
            sleep 5
            test \"\$(docker inspect --format '{{.State.Running}}' docs-site)\" = true
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          "
