name: Production Build & Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Build and deploy the production frontend"
        required: true
        type: boolean
        default: false
      deploy_backends:
        description: "Build images and deploy the production backends"
        required: true
        type: boolean
        default: false
      deploy_workers:
        description: "Deploy and start MAIPL CPU workers"
        required: true
        type: boolean
        default: false

jobs:
  frontend-build-and-deploy:
    if: inputs.deploy_frontend
    runs-on: self-hosted
    env:
      REGISTRY_URL: ${{ vars.REGISTRY_URL }}
      IMAGE_PREFIX: ${{ vars.REGISTRY_URL }}/library
      FRONTEND_HOST: ${{ vars.FRONTEND_HOST }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $FRONTEND_HOST >> ~/.ssh/known_hosts

      - name: Set script permissions
        run: |
          chmod +x frontend/scripts/build.sh

      - name: login to registry
        run: |
          echo $REGISTRY_PASSWORD | docker login http://$REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin

      - name: build and push image for prod
        run: |
          cd frontend
          source ./scripts/build.sh prod

      - name: Deploy to prod
        run: |
          if ! ssh ubuntu@$FRONTEND_HOST "
            echo $REGISTRY_PASSWORD | docker login http://$REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin || exit 1
            docker pull $IMAGE_PREFIX/maipl-frontend:prod || exit 1
            docker stop maipl-frontend || true
            docker rm maipl-frontend || true
            docker run -d --name maipl-frontend \
              --restart unless-stopped \
              -p 8081:80 \
              $IMAGE_PREFIX/maipl-frontend:prod || exit 1
            
            # Verify container is running
            sleep 5
            if ! docker ps --format '{{.Names}}' | grep -qx maipl-frontend; then
              echo 'Container failed to start' >&2
              exit 1
            fi
          "; then
            echo 'Deployment failed' >&2
            exit 1
          fi

  backend-build-and-deploy:
    if: inputs.deploy_backends || inputs.deploy_workers
    runs-on: self-hosted
    env:
      # Infrastructure variables
      REGISTRY_URL: ${{ vars.REGISTRY_URL }}
      IMAGE_PREFIX: ${{ vars.REGISTRY_URL }}/library
      BACKEND_HOST_A: ${{ vars.PROD_BACKEND_HOST_A }}
      BACKEND_HOST_B: ${{ vars.PROD_BACKEND_HOST_B }}
      WORKER_HOST_A: ${{ vars.PROD_WORKER_HOST_A }}
      WORKER_HOST_B: ${{ vars.PROD_WORKER_HOST_B }}
      WORKER_HOST_C: ${{ vars.PROD_WORKER_HOST_C }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      DEPLOY_BACKENDS: ${{ inputs.deploy_backends }}
      DEPLOY_WORKERS: ${{ inputs.deploy_workers }}

      # Email variables
      EMAIL_HOST: ${{ vars.EMAIL_HOST }}
      EMAIL_PORT: ${{ vars.EMAIL_PORT }}
      EMAIL_HOST_USER: ${{ vars.EMAIL_HOST_USER }}
      DEFAULT_FROM_EMAIL: ${{ vars.DEFAULT_FROM_EMAIL }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}

      # Redis variables
      REDIS_HOST: ${{ vars.REDIS_HOST }}

      # Celery broker variables
      CELERY_BROKER_URL_USER: ${{ secrets.CELERY_BROKER_URL_USER }}
      CELERY_BROKER_URL_PASSWORD: ${{ secrets.CELERY_BROKER_URL_PASSWORD }}
      CELERY_BROKER_URL_HOST: ${{ vars.CELERY_BROKER_URL_HOST }}

      # minio variables
      MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
      MINIO_EXTERNAL_ENDPOINT: ${{ vars.MINIO_EXTERNAL_ENDPOINT }}

      # postgres variables
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: 5432
      
      FILE_CACHE_LOCATION: /mnt/file_cache
      TASKS_LOCAL_STORAGE: /mnt/tasks

      # Environment-specific variables (PRODUCTION)
      ENVIRONMENT: "production"
      DJANGO_PORT: 8000
      DEBUG: 0
      DJANGO_ALLOWED_HOSTS: ${{ vars.PROD_DJANGO_ALLOWED_HOSTS }}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${{ vars.PROD_DJANGO_CSRF_TRUSTED_ORIGINS }}
      CORS_ALLOWED_ORIGINS: ${{ vars.PROD_CORS_ALLOWED_ORIGINS }}
      POSTGRES_DB: ${{ vars.PROD_POSTGRES_DB }}
      MINIO_BUCKET_NAME: ${{ vars.PROD_MINIO_BUCKET_NAME }}
      ALLOWED_REDIRECT_URLS: ${{ vars.PROD_ALLOWED_REDIRECT_URLS }}
      REDIS_DB: ${{ vars.PROD_REDIS_DB }}

      # Environment-specific secrets
      POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
      MINIO_ACCESS_KEY: ${{ secrets.PROD_MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.PROD_MINIO_SECRET_KEY }}
      DJANGO_SECRET_KEY: ${{ secrets.PROD_DJANGO_SECRET_KEY }}
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          for host in $BACKEND_HOST_A $BACKEND_HOST_B; do
            ssh-keyscan -H "$host" >> ~/.ssh/known_hosts
          done
          if [ "$DEPLOY_WORKERS" = "true" ]; then
            for host in $WORKER_HOST_A $WORKER_HOST_B $WORKER_HOST_C; do
              ssh-keyscan -H "$host" >> ~/.ssh/known_hosts
            done
          fi

      - name: login to registry
        if: env.DEPLOY_BACKENDS == 'true'
        run: |
          echo $REGISTRY_PASSWORD | docker login http://$REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin

      - name: Build backend and worker
        if: env.DEPLOY_BACKENDS == 'true'
        working-directory: backend/compose
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: docker compose -f docker-compose.build.yml build

      - name: Tag backend and worker
        if: env.DEPLOY_BACKENDS == 'true'
        run: |
          docker tag $IMAGE_PREFIX/maipl-backend/ketos-backend:dev $IMAGE_PREFIX/maipl-backend/ketos-backend:prod
          docker tag $IMAGE_PREFIX/maipl-backend/ketos-worker:dev $IMAGE_PREFIX/maipl-backend/ketos-worker:prod

      - name: Push backend and worker to registry
        if: env.DEPLOY_BACKENDS == 'true'
        run: |
          docker push $IMAGE_PREFIX/maipl-backend/ketos-backend:prod
          docker push $IMAGE_PREFIX/maipl-backend/ketos-worker:prod

      - name: Generate environment file
        if: env.DEPLOY_BACKENDS == 'true' || env.DEPLOY_WORKERS == 'true'
        run: |
          # Create .env file by combining variables and secrets
          cat > backend/.env << EOL
          # Environment
          DJANGO_ENV=${ENVIRONMENT}
          IMAGE_PREFIX=${IMAGE_PREFIX}
          
          # Django settings
          DJANGO_PORT=${DJANGO_PORT:-8000}
          DEBUG=${DEBUG:-0}
          DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost}
          DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost}
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          
          # Cors settings
          CORS_ALLOW_ALL_ORIGINS=false
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          
          # Database connection
          POSTGRES_DB=${POSTGRES_DB:-maipl-backend-prod}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_HOST=${POSTGRES_HOST:-maipl-database-prod-1}
          POSTGRES_PORT=${POSTGRES_PORT:-5432}
          
          # Minio settings
          MINIO_ENDPOINT=${MINIO_ENDPOINT:-maipl-minio-prod-1:9000}
          MINIO_USE_HTTPS=False
          MINIO_EXTERNAL_ENDPOINT=${MINIO_EXTERNAL_ENDPOINT:-minio.maipl.com}
          MINIO_EXTERNAL_ENDPOINT_USE_HTTPS=True
          MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
          MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
          MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-maipl-prod}
          
          # Email settings
          EMAIL_HOST=${EMAIL_HOST}
          EMAIL_PORT=${EMAIL_PORT}
          EMAIL_HOST_USER=${EMAIL_HOST_USER}
          EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
          DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
          EMAIL_USE_TLS=False
          EMAIL_USE_SSL=True
          
          # Other configuration
          ALLOWED_REDIRECT_URLS=${ALLOWED_REDIRECT_URLS}
          
          # File cache
          FILE_CACHE_LOCATION=${FILE_CACHE_LOCATION:-/mnt/file_cache}
          TASKS_LOCAL_STORAGE=${TASKS_LOCAL_STORAGE:-/mnt/tasks}
          
          # Redis
          REDIS_HOST=${REDIS_HOST:-maipl-redis} 
          REDIS_DB=${REDIS_DB:-2}

          # Celery broker
          CELERY_BROKER_URL_USER=${CELERY_BROKER_URL_USER}
          CELERY_BROKER_URL_PASSWORD=${CELERY_BROKER_URL_PASSWORD}
          CELERY_BROKER_URL_HOST=${CELERY_BROKER_URL_HOST}
          EOL

      - name: Deploy backends
        if: env.DEPLOY_BACKENDS == 'true'
        run: |
          # Create directory if it doesn't exist
          ssh ubuntu@$BACKEND_HOST_A "mkdir -p /srv/maipl/services/backend"
          ssh ubuntu@$BACKEND_HOST_B "mkdir -p /srv/maipl/services/backend"

          # Copy compose files and environment file
          scp backend/compose/docker-compose.backend.yml ubuntu@$BACKEND_HOST_A:/srv/maipl/services/backend/docker-compose.yml
          scp backend/compose/docker-compose.backend.yml ubuntu@$BACKEND_HOST_B:/srv/maipl/services/backend/docker-compose.yml
          scp backend/.env ubuntu@$BACKEND_HOST_A:/srv/maipl/services/backend/.env
          scp backend/.env ubuntu@$BACKEND_HOST_B:/srv/maipl/services/backend/.env
          scp backend/compose/promtail-config.yml ubuntu@$BACKEND_HOST_A:/srv/maipl/services/backend/promtail-config.yml
          scp backend/compose/promtail-config.yml ubuntu@$BACKEND_HOST_B:/srv/maipl/services/backend/promtail-config.yml

          # Deploy
          ssh ubuntu@$BACKEND_HOST_A "cd /srv/maipl/services/backend && \
            export HOSTNAME=backend-a && \
            echo $REGISTRY_PASSWORD | docker login http://$REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin && \
            docker compose pull && \
            docker compose down --remove-orphans && \
            docker compose up -d"

          ssh ubuntu@$BACKEND_HOST_B "cd /srv/maipl/services/backend && \
            export HOSTNAME=backend-b && \
            echo $REGISTRY_PASSWORD | docker login http://$REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin && \
            docker compose pull && \
            docker compose down --remove-orphans && \
            docker compose up -d"

      - name: Deploy workers
        if: env.DEPLOY_WORKERS == 'true'
        run: |
          # Create directory if it doesn't exist
          ssh ubuntu@$WORKER_HOST_A "mkdir -p /srv/maipl/services/worker"
          ssh ubuntu@$WORKER_HOST_B "mkdir -p /srv/maipl/services/worker"
          ssh ubuntu@$WORKER_HOST_C "mkdir -p /srv/maipl/services/worker"
          
          # Copy compose files and environment file
          scp backend/compose/docker-compose.worker.yml ubuntu@$WORKER_HOST_A:/srv/maipl/services/worker/docker-compose.yml
          scp backend/compose/docker-compose.worker.yml ubuntu@$WORKER_HOST_B:/srv/maipl/services/worker/docker-compose.yml
          scp backend/compose/docker-compose.worker.yml ubuntu@$WORKER_HOST_C:/srv/maipl/services/worker/docker-compose.yml
          scp backend/.env ubuntu@$WORKER_HOST_A:/srv/maipl/services/worker/.env
          scp backend/.env ubuntu@$WORKER_HOST_B:/srv/maipl/services/worker/.env
          scp backend/.env ubuntu@$WORKER_HOST_C:/srv/maipl/services/worker/.env
          scp backend/compose/promtail-config.yml ubuntu@$WORKER_HOST_A:/srv/maipl/services/worker/promtail-config.yml
          scp backend/compose/promtail-config.yml ubuntu@$WORKER_HOST_B:/srv/maipl/services/worker/promtail-config.yml
          scp backend/compose/promtail-config.yml ubuntu@$WORKER_HOST_C:/srv/maipl/services/worker/promtail-config.yml

          # Deploy
          ssh ubuntu@$WORKER_HOST_A "cd /srv/maipl/services/worker && \
            export HOSTNAME=worker-a && \
            echo $REGISTRY_PASSWORD | docker login http://$REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin && \
            docker compose pull && \
            docker compose down --remove-orphans && \
            docker compose up -d && \
            sleep 5 && \
            test \"\$(docker inspect -f '{{.State.Running}}' ketos-worker)\" = true"

          ssh ubuntu@$WORKER_HOST_B "cd /srv/maipl/services/worker && \
            export HOSTNAME=worker-b && \
            echo $REGISTRY_PASSWORD | docker login http://$REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin && \
            docker compose pull && \
            docker compose down --remove-orphans && \
            docker compose up -d && \
            sleep 5 && \
            test \"\$(docker inspect -f '{{.State.Running}}' ketos-worker)\" = true"

          ssh ubuntu@$WORKER_HOST_C "cd /srv/maipl/services/worker && \
            export HOSTNAME=worker-c && \
            echo $REGISTRY_PASSWORD | docker login http://$REGISTRY_URL --username $REGISTRY_USERNAME --password-stdin && \
            docker compose pull && \
            docker compose down --remove-orphans && \
            docker compose up -d && \
            sleep 5 && \
            test \"\$(docker inspect -f '{{.State.Running}}' ketos-worker)\" = true"
