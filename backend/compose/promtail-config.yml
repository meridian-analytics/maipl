server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://192.168.239.67:3100/loki/api/v1/push

scrape_configs:
  - job_name: application_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: application
          __path__: /logs/*.log
          environment: ${ENVIRONMENT:-development}

    pipeline_stages:
      - regex:
          expression: '^(?P<content>.+)$'
      - labels:
          content: 