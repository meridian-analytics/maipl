services:

  backend:
    image: registry.maipl-dev.com/maipl-backend/ketos-backend:dev
    container_name: backend-staging
    hostname: ${HOSTNAME}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - /data/logs:/logs
      - /data/file_cache:/cache
      - /data/tasks:/tasks
    command: /backend/entrypoint.backend.sh
    env_file:
      - .env
    depends_on:
      - rabbit

  worker:
    image: registry.maipl-dev.com/maipl-backend/ketos-worker:dev
    container_name: worker-staging
    hostname: ${HOSTNAME}
    command: /backend/entrypoint.worker.sh
    volumes:
      - /data/logs:/logs
      - /data/file_cache:/cache
      - /data/tasks:/tasks
    env_file:
      - .env
    depends_on:
      - rabbit

  rabbit:
    image: "rabbitmq:3-management"
    hostname: "rabbit"
    container_name: rabbit-staging
    environment:
      RABBITMQ_ERLANG_COOKIE: "SWQOKODSQALRPCLNMEQG"
      RABBITMQ_DEFAULT_USER: "rabbitmq"
      RABBITMQ_DEFAULT_PASS: "rabbitmq"
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "15672:15672"
      - "5672:5672"
    restart: unless-stopped

  portainer-agent:
    image: portainer/agent:2.21.2
    container_name: portainer-agent-staging
    hostname: ${HOSTNAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9443:9443"
    restart: unless-stopped
    depends_on:
      - rabbit
      - backend
      - worker

  # Promtail for log collection
  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail-staging
    hostname: ${HOSTNAME}
    volumes:
      - /data/logs:/logs
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml --config.expand-env=true
    restart: unless-stopped
    environment:
      - ENVIRONMENT=staging
