services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: ${IMAGE_PREFIX:-registry.maipl-dev.com}/maipl-backend/ketos-backend:prod
    container_name: ketos-backend
    hostname: ${HOSTNAME}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - ../logs:/logs
      - ${FILE_CACHE_LOCATION:-/mnt/file_cache}:/cache
      - ${TASKS_LOCAL_STORAGE:-/mnt/tasks}:/tasks
    command: /backend/entrypoint.backend.sh
    env_file:
      - .env
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail-backend
    hostname: ${HOSTNAME}
    volumes:
      - ../logs:/logs
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml --config.expand-env=true
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - HOSTNAME=${HOSTNAME}

  portainer-agent:
    image: portainer/agent:2.21.2
    container_name: portainer-agent-backend
    hostname: ${HOSTNAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9443:9443"
    restart: unless-stopped
