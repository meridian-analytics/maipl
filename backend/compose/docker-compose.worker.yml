services:
  worker:
    image: registry.maipl-dev.com/maipl-backend/ketos-worker:prod
    container_name: ketos-worker
    volumes:
      - ../logs:/logs
      - ${FILE_CACHE_LOCATION:-/mnt/file_cache}:/cache
      - ${TASKS_LOCAL_STORAGE:-/mnt/tasks}:/tasks
    command: /backend/entrypoint.worker.sh
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ utility, compute, video ]
  portainer-agent:
    image: portainer/agent:2.21.2
    container_name: portainer-agent-worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
