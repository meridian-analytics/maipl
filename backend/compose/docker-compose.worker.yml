services:
  worker:
    image: registry.maipl-dev.com/maipl-backend/ketos-worker:prod
    container_name: ketos-worker
    volumes:
      - ../logs:/logs
      - ${FILE_CACHE_LOCATION:-/mnt/file_cache}:/cache
      - ${TASKS_LOCAL_STORAGE:-/mnt/tasks}:/tasks
    command: /backend/entrypoint.worker.sh
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ utility, compute, video ]

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail-worker
    hostname: ${HOSTNAME}
    volumes:
      - ../logs:/logs
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml --config.expand-env=true
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production

  portainer-agent:
    image: portainer/agent:2.21.2
    container_name: portainer-agent-worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
