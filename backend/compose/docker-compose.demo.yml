services:

  backend:
    image: registry.maipl-dev.com/maipl-backend/ketos-backend:demo
    container_name: backend-demo
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - /data/logs:/logs
      - /data/file_cache:/cache
      - /data/tasks:/tasks
    command: /backend/entrypoint.backend.sh
    env_file:
      - .env
    depends_on:
      - rabbit

  worker:
    image: registry.maipl-dev.com/maipl-backend/ketos-worker:demo
    container_name: worker-demo
    command: /backend/entrypoint.worker.sh
    volumes:
      - /data/logs:/logs
      - /data/file_cache:/cache
      - /data/tasks:/tasks
    env_file:
      - .env
    depends_on:
      - rabbit

  rabbit:
    image: "rabbitmq:3-management"
    hostname: "rabbit"
    container_name: rabbit-demo
    environment:
      RABBITMQ_ERLANG_COOKIE: "SWQOKODSQALRPCLNMEQG"
      RABBITMQ_DEFAULT_USER: "rabbitmq"
      RABBITMQ_DEFAULT_PASS: "rabbitmq"
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "15672:15672"
      - "5672:5672"
    restart: unless-stopped

  portainer-agent:
    image: portainer/agent:2.21.2
    container_name: portainer-agent-demo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9443:9443"
    restart: unless-stopped
    depends_on:
      - rabbit
      - backend
      - worker
