---
- name: Create Minio config directory
  file:
    path: "{{ minio_config_dir }}"
    state: directory
    mode: '0755'

- name: Create docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ minio_config_dir }}/docker-compose.yml"
    mode: '0644'

- name: Create .env file
  template:
    src: .env.j2
    dest: "{{ minio_config_dir }}/.env"
    mode: '0600'

- name: Deploy Minio
  community.docker.docker_compose_v2:
    project_src: "{{ minio_config_dir }}"
    state: present