---
- name: Copy Minio dashboard to temporary location
  template:
    src: minio-dashboard.json.j2
    dest: /tmp/minio-dashboard.json
    mode: '0644'
  delegate_to: "{{ monitoring_server }}"

- name: Read dashboard file
  slurp:
    src: /tmp/minio-dashboard.json
  register: dashboard_content
  delegate_to: "{{ monitoring_server }}"

- name: Import Minio dashboard to Grafana
  uri:
    url: "{{ grafana_url }}/api/dashboards/db"
    method: POST
    body_format: json
    body:
      dashboard: "{{ dashboard_content.content | b64decode | from_json }}"
      overwrite: true
    headers:
      Authorization: "Bearer {{ monitoring.grafana.api_key | default(grafana_api_key) }}"
    status_code: 200
  delegate_to: "{{ monitoring_server }}"
  ignore_errors: true
  register: grafana_import
  
- name: Display Grafana import status
  debug:
    msg: "Grafana dashboard import was skipped or failed. You may need to set a valid GRAFANA_API_KEY environment variable or update the grafana_api_key in your vault file."
  when: grafana_import is failed