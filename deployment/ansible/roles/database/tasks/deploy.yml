---
- name: Install required Python packages
  pip:
    name:
      - docker==6.1.3
      - docker-compose==1.29.2
    state: present

- name: Create PostgreSQL data directory
  file:
    path: "{{ postgresql_data_dir }}/data"
    state: directory
    mode: '0700'  # PostgreSQL requires strict permissions
    owner: "999"  # postgres user in container
    group: "999"  # postgres group in container

- name: Create pgAdmin directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
    owner: "5050"  # pgAdmin container runs as UID 5050
    group: "5050"
  with_items:
    - "{{ postgresql_data_dir }}/pgadmin"
    - "{{ postgresql_data_dir }}/pgadmin/sessions"

- name: Create docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ postgresql_data_dir }}/docker-compose.yml"
    mode: '0644'

- name: Pull PostgreSQL image
  community.docker.docker_image:
    name: "postgres:{{ postgresql_version }}"
    source: pull
    force_source: yes

- name: Start PostgreSQL container
  community.docker.docker_compose_v2:
    project_src: "{{ postgresql_data_dir }}"
    state: present