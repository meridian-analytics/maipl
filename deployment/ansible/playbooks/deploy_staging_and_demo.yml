---
- name: Setup volume and Docker
  hosts: all
  become: true
  vars:
    data_device: /dev/vdb
    data_dir: /data
    docker_compose_version: "2.17.2"

  tasks:
    - name: Format the data volume
      community.general.filesystem:
        fstype: ext4
        dev: "{{ data_device }}"
      when: data_device is defined

    - name: Create base data directory
      file:
        path: "{{ data_dir }}"
        state: directory
        mode: '0755'

    - name: Mount data volume
      mount:
        path: "{{ data_dir }}"
        src: "{{ data_device }}"
        fstype: ext4
        state: mounted
      when: data_device is defined

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - python3-docker
        state: present
        update_cache: yes

    - name: Install Docker Compose via pip
      pip:
        name: 
          - docker-compose
          - docker
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Ensure docker group exists
      group:
        name: docker
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
