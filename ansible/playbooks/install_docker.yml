---
- name: Install Docker and Docker Compose on new instances
  hosts: new_instances
  become: yes

  tasks:
    - name: Update apt and install prerequisites
      apt:
        update_cache: yes
        name: 
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker's official APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Install Docker
      apt:
        name: docker-ce
        state: present
        update_cache: yes

    - name: Gather system information
      setup:
        filter: "ansible_system,ansible_architecture"

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-{{ ansible_system }}-{{ ansible_architecture | lower }}"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Create Docker group
      group:
        name: docker
        state: present

    - name: Add user to the Docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Reconnect to apply group changes
      meta: reset_connection

    - name: Enable and start Docker service
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Test Docker installation
      shell: docker run hello-world
      ignore_errors: yes