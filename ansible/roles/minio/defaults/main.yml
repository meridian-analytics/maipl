---
# Volume configuration
minio_volume_devices:
  - /dev/vdb
  - /dev/vdc
  - /dev/vdd
  - /dev/vde
minio_data_dirs:
  - /data/minio/disk1
  - /data/minio/disk2
  - /data/minio/disk3
  - /data/minio/disk4
minio_config_dir: /etc/minio

# Docker configuration
docker_compose_version: "2.17.2"

# Minio configuration
minio_api_port: 9000
minio_console_port: 9001

# Monitoring configuration - Simple flat structure
monitoring_server: "192.168.239.67"
grafana_port: 3000
prometheus_port: 9090
loki_port: 3100
grafana_api_key: "{{ lookup('ansible.builtin.env', 'GRAFANA_API_KEY', default='eyJrIjoiWW91U2hvdWxkQ2hhbmdlVGhpc0luVmF1bHQiLCJuIjoibWluaW8iLCJpZCI6MX0=') }}"

# Full URLs using the flat variables
grafana_url: "http://{{ monitoring_server }}:{{ grafana_port }}"
prometheus_url: "http://{{ monitoring_server }}:{{ prometheus_port }}"
loki_url: "http://{{ monitoring_server }}:{{ loki_port }}"

# Prometheus configuration
prometheus_config_dir: /etc/prometheus
prometheus_conf_d_dir: "{{ prometheus_config_dir }}/conf.d"

# Environment
environment: "prod"