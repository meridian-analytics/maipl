---
# Create conf.d directory
- name: Create Prometheus directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/prometheus/conf.d
    - /etc/prometheus/conf.d/jobs
  delegate_to: 192.168.239.67
  become: true

# Update main Prometheus config
- name: Update main Prometheus config
  template:
    src: prometheus-main.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: '0644'
    backup: yes
  delegate_to: 192.168.239.67
  become: true

# Add Minio job config
- name: Add Minio job config
  template:
    src: minio.yml.j2
    dest: /etc/prometheus/conf.d/jobs/minio.yml
    mode: '0644'
  delegate_to: 192.168.239.67
  become: true

# Verify Prometheus config
- name: Verify Prometheus configuration
  command: promtool check config /etc/prometheus/prometheus.yml
  delegate_to: 192.168.239.67
  become: true
  register: prometheus_check
  failed_when: prometheus_check.rc != 0

# Update Prometheus service configuration
- name: Update Prometheus service configuration
  template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: '0644'
  delegate_to: 192.168.239.67
  become: true

# Reload systemd
- name: Reload systemd
  systemd:
    daemon_reload: yes
  delegate_to: 192.168.239.67
  become: true

# Restart Prometheus instead of reload
- name: Restart Prometheus service
  systemd:
    name: prometheus
    state: restarted
  delegate_to: 192.168.239.67
  become: true

# Add verification
- name: Verify Prometheus target is up
  uri:
    url: "http://192.168.239.67:9090/api/v1/targets"
    return_content: yes
  register: targets
  delegate_to: localhost
  failed_when: false
  
- name: Display target status
  debug:
    var: targets.json.data.activeTargets
  when: targets.status == 200

# Promtail for logs
- name: Create Promtail directory
  file:
    path: "{{ minio_config_dir }}/promtail"
    state: directory
    mode: '0755'

- name: Configure Promtail
  template:
    src: promtail-config.yml.j2
    dest: "{{ minio_config_dir }}/promtail/config.yml"
    mode: '0644'

- name: Deploy Promtail container
  community.docker.docker_compose_v2:
    project_name: promtail
    definition:
      version: '3'
      services:
        promtail:
          image: grafana/promtail:latest
          container_name: minio-promtail
          volumes:
            - /var/log:/var/log
            - "{{ minio_config_dir }}/promtail:/etc/promtail"
          command: -config.file=/etc/promtail/config.yml
          restart: unless-stopped

