---
- name: Wait for Minio metrics endpoint
  uri:
    url: "http://{{ ansible_host }}:9000/minio/v2/metrics/cluster"
    method: GET
    status_code: 200
    timeout: 5  # Add timeout
  register: result
  until: result.status == 200
  retries: 6
  delay: 10
  delegate_to: localhost

- name: Check Prometheus target status
  uri:
    url: "{{ prometheus_url }}/api/v1/targets"
    method: GET
  register: targets
  delegate_to: localhost
  failed_when: >
    targets.json.data.activeTargets | selectattr('labels.job', 'equalto', 'minio')
    | selectattr('health', 'equalto', 'down') | list | length > 0

- name: Display target status
  debug:
    var: targets

- name: Verify Grafana dashboard
  uri:
    url: "{{ grafana_url }}/api/dashboards/uid/minio"
    headers:
      Authorization: "Bearer {{ grafana_api_key }}"
    method: GET
  register: dashboard
  delegate_to: localhost
  failed_when: dashboard.status != 200
  retries: 3
  delay: 5
