services:
  frontend:
    profiles: [built-frontend]

  frontend-dev:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: >-
      sh -c "pnpm install --frozen-lockfile &&
      ./scripts/setup-env.sh proxy &&
      pnpm @start"
    environment:
      VITE_HMR_CLIENT_PORT: ${MAIPL_DEV_HMR_PORT:-8080}
    volumes:
      - ./frontend:/workspace
      - frontend-dev-node-modules:/workspace/node_modules
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  frontend-dev-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/vite-proxy.conf:/etc/nginx/vite-proxy.conf:ro
    depends_on:
      - frontend-dev

volumes:
  frontend-dev-node-modules:
