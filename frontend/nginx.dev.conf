server {
    listen 80;
    server_name _;

    location = / {
        return 302 /file-service/dashboard;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }

    location /media/ {
        proxy_pass http://backend:8000;
    }

    location /authentication-service/ {
        proxy_pass http://frontend-dev:3000;
        include /etc/nginx/vite-proxy.conf;
    }
    location = /authentication-service { return 302 /authentication-service/; }

    location /file-service/ {
        proxy_pass http://frontend-dev:3100;
        include /etc/nginx/vite-proxy.conf;
    }
    location = /file-service { return 302 /file-service/; }

    location /annotation-tool/ {
        proxy_pass http://frontend-dev:3200;
        include /etc/nginx/vite-proxy.conf;
    }
    location = /annotation-tool { return 302 /annotation-tool/; }

    location /model-runner/ {
        proxy_pass http://frontend-dev:3300;
        include /etc/nginx/vite-proxy.conf;
    }
    location = /model-runner { return 302 /model-runner/; }

    location /metrics/ {
        proxy_pass http://frontend-dev:3400;
        include /etc/nginx/vite-proxy.conf;
    }
    location = /metrics { return 302 /metrics/; }

    location /model-trainer/ {
        proxy_pass http://frontend-dev:3500;
        include /etc/nginx/vite-proxy.conf;
    }
    location = /model-trainer { return 302 /model-trainer/; }

    location /database-tool/ {
        proxy_pass http://frontend-dev:3600;
        include /etc/nginx/vite-proxy.conf;
    }
    location = /database-tool { return 302 /database-tool/; }
}
